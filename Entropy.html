<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>UNTABOO VR - High-Performance Interactive Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    // =========================================================================
    // 1. INSTANT ZERO-LATENCY AUDIO SYNTHESIZER
    // =========================================================================
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      play(freq, type = 'sine', duration = 0.08, gainVal = 0.08) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) { }
      },
      hover() { this.play(540, 'sine', 0.04, 0.03); },
      success() {
        this.play(587.33, 'triangle', 0.1, 0.08);
        setTimeout(() => this.play(880, 'triangle', 0.15, 0.08), 70);
      },
      error() {
        this.play(260, 'sawtooth', 0.12, 0.08);
        setTimeout(() => this.play(196, 'sawtooth', 0.18, 0.08), 80);
      },
      click() { this.play(700, 'sine', 0.06, 0.06); }
    };

    // Controller Haptics for Meta Quest 3 / 3S
    function triggerHaptics(duration = 40, intensity = 0.5) {
      try {
        ['#left-hand', '#right-hand'].forEach(selector => {
          const el = document.querySelector(selector);
          if (el && el.components['tracked-controls']) {
            const ctrl = el.components['tracked-controls'].controller;
            if (ctrl && ctrl.vibrationActuator) {
              ctrl.vibrationActuator.playEffect('dual-rumble', {
                startDelay: 0,
                duration: duration,
                weakMagnitude: intensity,
                strongMagnitude: intensity
              });
            }
          }
        });
      } catch (e) { }
    }

    // =========================================================================
    // 2. ULTRA-FAST INTERACTIVE 3D BUTTON COMPONENT
    // =========================================================================
    AFRAME.registerComponent('interactive-btn', {
      schema: {
        defaultColor: { type: 'color', default: '#161b22' },
        hoverColor: { type: 'color', default: '#00f2fe' }
      },
      init() {
        const el = this.el;
        const basePos = el.getAttribute('position');
        this.baseZ = basePos.z;

        el.addEventListener('mouseenter', () => {
          Sound.hover();
          triggerHaptics(25, 0.3);
          el.setAttribute('material', 'color', this.data.hoverColor);
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('material', 'color', this.data.defaultColor);
          el.object3D.position.z = this.baseZ;
        });

        el.addEventListener('mousedown', () => {
          el.object3D.position.z = this.baseZ - 0.03;
        });

        el.addEventListener('mouseup', () => {
          el.object3D.position.z = this.baseZ;
        });

        el.addEventListener('click', () => {
          triggerHaptics(60, 0.7);
        });
      }
    });

    // =========================================================================
    // 3. FAST PRE-RENDERED STATION LOGIC (Direct Plane Visibility Toggling)
    // =========================================================================

    // Station 1: Multi-Scenario Boundary Engine
    AFRAME.registerComponent('station-boundaries', {
      init() {
        this.scenarios = [
          {
            speaker: "Partner says:",
            prompt: "\"I'm feeling overwhelmed and want to stop for tonight.\"",
            correct: "Stop & Affirm",
            wrong: "Convince Otherwise",
            info: "Active consent is continuous and can be withdrawn at any point without pressure."
          },
          {
            speaker: "Date says:",
            prompt: "\"I only want to continue if we use protection every time.\"",
            correct: "Respect Boundary",
            wrong: "Negotiate Raw",
            info: "Preconditions for sexual wellness and barrier safety are absolute personal choices."
          },
          {
            speaker: "Partner says:",
            prompt: "\"I don't want to share my private phone passwords or photos.\"",
            correct: "Honor Privacy",
            wrong: "Demand Proof",
            info: "Digital privacy and emotional boundaries are integral components of relationship health."
          }
        ];
        this.idx = 0;

        this.speakerText = document.querySelector('#s1-speaker');
        this.promptText = document.querySelector('#s1-prompt');
        this.stepText = document.querySelector('#s1-step');
        this.feedbackText = document.querySelector('#s1-feedback');
        this.btnCorrectText = document.querySelector('#s1-btn-correct-txt');
        this.btnWrongText = document.querySelector('#s1-btn-wrong-txt');

        document.querySelector('#s1-btn-correct').addEventListener('click', () => this.handleAnswer(true));
        document.querySelector('#s1-btn-wrong').addEventListener('click', () => this.handleAnswer(false));
      },
      handleAnswer(isCorrect) {
        const item = this.scenarios[this.idx];
        if (isCorrect) {
          Sound.success();
          this.feedbackText.setAttribute('value', `CORRECT: ${item.info}`);
          this.feedbackText.setAttribute('color', '#4ECCA3');

          this.idx = (this.idx + 1) % this.scenarios.length;
          const next = this.scenarios[this.idx];

          setTimeout(() => {
            this.speakerText.setAttribute('value', next.speaker);
            this.promptText.setAttribute('value', next.prompt);
            this.btnCorrectText.setAttribute('value', next.correct);
            this.btnWrongText.setAttribute('value', next.wrong);
            this.stepText.setAttribute('value', `SCENARIO ${this.idx + 1} / 3`);
          }, 1500);
        } else {
          Sound.error();
          this.feedbackText.setAttribute('value', "VIOLATION: Coercion or guilt violates consent. Respect is mandatory.");
          this.feedbackText.setAttribute('color', '#FF5376');
        }
      }
    });

    // Station 2: Myth vs Fact Engine
    AFRAME.registerComponent('station-myths', {
      init() {
        this.items = [
          {
            q: "Statement: Condoms offer 100% protection against all STIs.",
            isMyth: true,
            exp: "MYTH: Fluid-borne STIs are blocked, but skin-to-skin infections (HPV, Herpes) can still spread."
          },
          {
            q: "Statement: Many STIs have zero noticeable symptoms at first.",
            isMyth: false,
            exp: "FACT: Chlamydia, HPV, and early HIV are often completely asymptomatic. Regular screening is essential."
          },
          {
            q: "Statement: Double-layering condoms provides double safety.",
            isMyth: true,
            exp: "MYTH: Friction causes both condoms to rip easily. Use only one condom at a time."
          }
        ];
        this.idx = 0;

        this.qText = document.querySelector('#s2-question');
        this.stepText = document.querySelector('#s2-step');
        this.feedbackText = document.querySelector('#s2-feedback');

        document.querySelector('#s2-btn-myth').addEventListener('click', () => this.evaluate(true));
        document.querySelector('#s2-btn-fact').addEventListener('click', () => this.evaluate(false));
      },
      evaluate(choseMyth) {
        const item = this.items[this.idx];
        if (choseMyth === item.isMyth) {
          Sound.success();
          this.feedbackText.setAttribute('value', `CORRECT! ${item.exp}`);
          this.feedbackText.setAttribute('color', '#4ECCA3');

          this.idx = (this.idx + 1) % this.items.length;
          const next = this.items[this.idx];

          setTimeout(() => {
            this.qText.setAttribute('value', next.q);
            this.stepText.setAttribute('value', `ITEM ${this.idx + 1} / 3`);
          }, 1600);
        } else {
          Sound.error();
          this.feedbackText.setAttribute('value', `INCORRECT! ${item.exp}`);
          this.feedbackText.setAttribute('color', '#FF5376');
        }
      }
    });

    // Station 3: Instant Toggle Hub
    AFRAME.registerComponent('station-hub', {
      init() {
        const topics = {
          clinic: {
            title: "YOUTH & SEXUAL HEALTH CLINICS",
            desc: "Confidential care, free or sliding-scale STI tests, and birth control options without judgment or disclosure requirements."
          },
          contraception: {
            title: "CONTRACEPTION STRATEGY",
            desc: "Dual protection: Use LARCs or Hormonal options for pregnancy prevention alongside Barrier methods (condoms) for STIs."
          },
          prep: {
            title: "PrEP & PEP MEDICATIONS",
            desc: "PrEP taken regularly reduces HIV transmission risk by >99%. PEP provides emergency post-exposure relief within 72 hours."
          }
        };

        const titleEl = document.querySelector('#s3-title');
        const descEl = document.querySelector('#s3-desc');

        ['clinic', 'contraception', 'prep'].forEach(key => {
          document.querySelector(`#s3-btn-${key}`).addEventListener('click', () => {
            Sound.click();
            titleEl.setAttribute('value', topics[key].title);
            descEl.setAttribute('value', topics[key].desc);
          });
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden; background-color: #06070a;">
  <a-scene renderer="antialias: true; powerPreference: high-performance; precision: medium;"
    background="color: #06070a">

    <a-entity light="type: ambient; color: #94a3b8; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.5; position: 0 4 2"></a-entity>

    <a-plane position="0 0 0" rotation="-90 0 0" width="18" height="18" color="#0c0e14" roughness="1"></a-plane>
    <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="3.1" radius-outer="3.15" color="#00f2fe"
      opacity="0.4"></a-ring>
    <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="0.9" radius-outer="0.93" color="#ff007f"
      opacity="0.3"></a-ring>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="head" position="0 1.6 0" look-controls wasd-controls>
        <a-cursor id="cursor" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018"
          material="color: #00f2fe; shader: flat" raycaster="objects: .clickable; interval: 30"
          cursor="rayOrigin: mouse">
        </a-cursor>
      </a-camera>

      <a-entity id="left-hand" laser-controls="hand: left"
        raycaster="objects: .clickable; interval: 30; lineColor: #00f2fe">
      </a-entity>

      <a-entity id="right-hand" laser-controls="hand: right"
        raycaster="objects: .clickable; interval: 30; lineColor: #ff007f">
      </a-entity>
    </a-entity>

    <a-entity position="0 3.0 -3.3">
      <a-text value="UNTABOO VR" align="center" width="7" color="#00f2fe"></a-text>
      <a-text value="Interactive WebXR Health & Boundary Awareness System" position="0 -0.32 0" align="center"
        width="3.2" color="#94a3b8"></a-text>
    </a-entity>

    <a-entity position="-2.4 0 -2.4" rotation="0 38 0" station-boundaries>
      <a-plane position="0 1.6 0" width="2.7" height="2.1" color="#11141e"></a-plane>
      <a-plane position="0 2.64 0.01" width="2.7" height="0.03" color="#00f2fe"></a-plane>

      <a-text value="MODULE 01: BOUNDARIES" position="0 2.4 0.02" align="center" width="3.6" color="#00f2fe"></a-text>
      <a-text id="s1-step" value="SCENARIO 1 / 3" position="0 2.2 0.02" align="center" width="2.2"
        color="#64748b"></a-text>

      <a-plane position="0 1.78 0.02" width="2.4" height="0.55" color="#080a0f">
        <a-text id="s1-speaker" value="Partner says:" position="-1.1 0.16 0.01" align="left" width="2.2"
          color="#ff007f"></a-text>
        <a-text id="s1-prompt" value="&quot;I'm feeling overwhelmed and want to stop for tonight.&quot;"
          position="0 -0.06 0.01" align="center" width="2.3" wrap-count="32" color="#ffffff"></a-text>
      </a-plane>

      <a-entity id="s1-btn-correct" class="clickable" position="-0.65 1.25 0.06"
        geometry="primitive: box; width: 1.05; height: 0.32; depth: 0.06" material="color: #162f25"
        interactive-btn="defaultColor: #162f25; hoverColor: #255845">
        <a-text id="s1-btn-correct-txt" value="Stop & Affirm" align="center" width="2.4" color="#4ECCA3"
          position="0 0 0.04"></a-text>
      </a-entity>

      <a-entity id="s1-btn-wrong" class="clickable" position="0.65 1.25 0.06"
        geometry="primitive: box; width: 1.05; height: 0.32; depth: 0.06" material="color: #3b161e"
        interactive-btn="defaultColor: #3b161e; hoverColor: #632330">
        <a-text id="s1-btn-wrong-txt" value="Convince Otherwise" align="center" width="2.4" color="#FF5376"
          position="0 0 0.04"></a-text>
      </a-entity>

      <a-plane position="0 0.82 0.02" width="2.4" height="0.4" color="#080a0f">
        <a-text id="s1-feedback" value="Click an option above to examine boundary dynamics." align="center" width="2.3"
          wrap-count="34" color="#94a3b8"></a-text>
      </a-plane>
    </a-entity>

    <a-entity position="0 0 -3.4" rotation="0 0 0" station-myths>
      <a-plane position="0 1.6 0" width="2.7" height="2.1" color="#11141e"></a-plane>
      <a-plane position="0 2.64 0.01" width="2.7" height="0.03" color="#ff007f"></a-plane>

      <a-text value="MODULE 02: MYTH VS FACT" position="0 2.4 0.02" align="center" width="3.6" color="#ff007f"></a-text>
      <a-text id="s2-step" value="ITEM 1 / 3" position="0 2.2 0.02" align="center" width="2.2" color="#64748b"></a-text>

      <a-plane position="0 1.78 0.02" width="2.4" height="0.55" color="#080a0f">
        <a-text id="s2-question" value="Statement: Condoms offer 100% protection against all STIs." align="center"
          width="2.3" wrap-count="32" color="#ffffff"></a-text>
      </a-plane>

      <a-entity id="s2-btn-myth" class="clickable" position="-0.65 1.25 0.06"
        geometry="primitive: box; width: 1.05; height: 0.32; depth: 0.06" material="color: #2b1638"
        interactive-btn="defaultColor: #2b1638; hoverColor: #52226d">
        <a-text value="MYTH" align="center" width="3.2" color="#ff007f" position="0 0 0.04"></a-text>
      </a-entity>

      <a-entity id="s2-btn-fact" class="clickable" position="0.65 1.25 0.06"
        geometry="primitive: box; width: 1.05; height: 0.32; depth: 0.06" material="color: #102638"
        interactive-btn="defaultColor: #102638; hoverColor: #1a496f">
        <a-text value="FACT" align="center" width="3.2" color="#00f2fe" position="0 0 0.04"></a-text>
      </a-entity>

      <a-plane position="0 0.82 0.02" width="2.4" height="0.4" color="#080a0f">
        <a-text id="s2-feedback" value="Evaluate the statement using medical evidence." align="center" width="2.3"
          wrap-count="34" color="#94a3b8"></a-text>
      </a-plane>
    </a-entity>

    <a-entity position="2.4 0 -2.4" rotation="0 -38 0" station-hub>
      <a-plane position="0 1.6 0" width="2.7" height="2.1" color="#11141e"></a-plane>
      <a-plane position="0 2.64 0.01" width="2.7" height="0.03" color="#4ECCA3"></a-plane>

      <a-text value="MODULE 03: HEALTH HUB" position="0 2.4 0.02" align="center" width="3.6" color="#4ECCA3"></a-text>
      <a-text value="CONFIDENTIAL RESOURCES" position="0 2.2 0.02" align="center" width="2.2" color="#64748b"></a-text>

      <a-entity id="s3-btn-clinic" class="clickable" position="-0.75 1.82 0.06"
        geometry="primitive: box; width: 0.68; height: 0.24; depth: 0.06" material="color: #121c2b"
        interactive-btn="defaultColor: #121c2b; hoverColor: #00f2fe">
        <a-text value="Clinics" align="center" width="2.0" color="#ffffff" position="0 0 0.04"></a-text>
      </a-entity>

      <a-entity id="s3-btn-contraception" class="clickable" position="0 1.82 0.06"
        geometry="primitive: box; width: 0.72; height: 0.24; depth: 0.06" material="color: #121c2b"
        interactive-btn="defaultColor: #121c2b; hoverColor: #9d4edd">
        <a-text value="Protection" align="center" width="2.0" color="#ffffff" position="0 0 0.04"></a-text>
      </a-entity>

      <a-entity id="s3-btn-prep" class="clickable" position="0.75 1.82 0.06"
        geometry="primitive: box; width: 0.68; height: 0.24; depth: 0.06" material="color: #121c2b"
        interactive-btn="defaultColor: #121c2b; hoverColor: #ff007f">
        <a-text value="PrEP / PEP" align="center" width="2.0" color="#ffffff" position="0 0 0.04"></a-text>
      </a-entity>

      <a-plane position="0 1.1 0.02" width="2.4" height="0.85" color="#080a0f">
        <a-text id="s3-title" value="YOUTH & SEXUAL HEALTH CLINICS" position="0 0.24 0.01" align="center" width="2.4"
          color="#00f2fe"></a-text>
        <a-text id="s3-desc"
          value="Confidential care, free or sliding-scale STI tests, and birth control options without judgment or disclosure requirements."
          position="0 -0.1 0.01" align="center" width="2.3" wrap-count="32" color="#94a3b8"></a-text>
      </a-plane>
    </a-entity>

  </a-scene>
</body>

</html>
